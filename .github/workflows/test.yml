name: Logic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  logic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile sudo_yubikey.py
      - run: bash -n sudo-yubikey.sh
      - run: python sudo_yubikey.py --version
